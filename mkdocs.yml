site_name: alp-data
site_description: Unified access to 35+ bioacoustic datasets behind one Python interface.
strict: true  # with strict=True, make sure all links are valid, otherwise mkdocs build will fail
site_url: https://projects.earthspecies.org/alp-data/

# Check out https://mkdocstrings.github.io/recipes/

repo_name: earthspecies/alp-data
repo_url: https://github.com/earthspecies/alp-data

nav:
  - Home: index.md
  - Guides:
      - Getting Started: getting-started.md
      - Datasets:
          - Overview: datasets.md
          - Available Datasets: datasets-available.md
          - Using Your Own Dataset: datasets-custom.md
      - IO: io.md
      - Transforms: transforms.md
      - Concatenate Datasets: concatenate.md
      - Chain Datasets: chain.md
      - Backends: backends.md
      - Tutorials:
          - 1. Basics: tutorials/01_basics.ipynb
          - 2. IO: tutorials/02_io.ipynb
          - 3. PyTorch DataLoader: tutorials/03_pytorch_dataloader.ipynb
          - 4. YAML Config: tutorials/04_yaml_config.ipynb
          - 5. Transforms: tutorials/05_transforms.ipynb
          - 6. Concatenate & Chain: tutorials/06_concat_and_chain.ipynb
          - 7. User Datasets & Transforms: tutorials/07_user_datasets_and_transforms.ipynb
  - Resources:
      - API Reference: reference.md
      - Interactive Explorer: explorer.md
      - Get Involved: community.md

theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/esp-logotype-only-white.png
  font: false
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to system preference

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: numpy
            show_category_heading: false
            show_symbol_type_toc: true
            show_symbol_type_heading: true
            modernize_annotations: true
            show_bases: false
            show_source: true

hooks:
  - _hooks/dataset_info_hook.py
  - _hooks/hide_toc_hook.py

markdown_extensions:
  - toc:
      title: On this page
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

# keeps these files OUT of the published docs site
# (generated by `mkdocs build` or `mkdocs serve`)
exclude_docs: |
  __pycache__/
  *.pyc

extra_css:
  - stylesheets/extra.css

extra:
  version:
    provider: mike
  # Google analytics
  analytics:
    provider: google
    property: G-D1DJTVNX6B
  # Cookie consent banner
  consent:
    title: Cookie consent
    description: >-
      We use cookies to understand which documentation pages are most useful.
    cookies:
      analytics: Google Analytics
    actions: [accept, reject, manage]
