[project]
name = "alp-data"
version = "1.11.1"
description = "Data tools for ESP projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gcsfs>=2024.9.0.post1",
    "google-auth>=2.0.0",
    "google-cloud-secret-manager>=2.23.1",
    "google-cloud-storage>=2.19.0",
    "intervaltree>=3.1.0",
    "librosa>=0.11.0",
    "pandas",
    "polars[pyarrow]>=1.33.1",
    "pydantic>=2",
    "pyyaml>=6.0.2",
    "resampy",
    "s3fs>=2024.9.0",
    "semver",
    "soundfile>=0.13.1",
]

[dependency-groups]
benchmark = [
    "matplotlib>=3.10.7",
    "memory-profiler>=0.61.0",
    "torch>=2.9.1",
]
dev = [
    "mike>=2.1.3",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.11",
    "mkdocstrings-python>=1.16.10",
    "prek>=0.2.28",
    "pytest>=7.1.2",
    "ruff>=0.15.10",
    "deptry>=0.23.0",
    "mkdocs-jupyter>=0.26.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
exclude-newer = "7 days"

[tool.uv.exclude-newer-package]
torch = false

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["alp_data"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = [
  ".", "alp_data",
]
python_files = [
    "test_*.py",
    "check_*.py",
]

[tool.ruff]
line-length = 100
indent-width = 4
exclude = [
  "**/*.ipynb",
  "tests",
]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
  "E4",
  "E7",
  "E9",
  "F", # Flake8
  "UP007", # Check for typing.Union annotations that can be rewritten with PEP 604 syntax
  "UP045", # Check for typing.Optional annotations that can be rewritten with PEP 604 syntax
]

extend-select = ["DOC", "B9", "B", "E", "W", "ANN", "I"]
fixable = ["ALL"]
unfixable = []
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-line-length = "dynamic"

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 10.
max-complexity = 10

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true # suppress ANN401 for *args and **kwargs arguments

[tool.codespell]
skip = "*.csv, *.ipynb"

[tool.deptry]
exclude = ["conftest.py", ".venv", "tests", "scripts", "notebooks", "_hooks/.*", "docs/tutorials/.*"]
ignore = ["DEP003"]

[tool.deptry.per_rule_ignores]
DEP002 = ["resampy"]
